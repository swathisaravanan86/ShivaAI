name: shiva_ai
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: ^3.13.5
 
dependencies:
  flutter:
    sdk: flutter
 
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  shared_preferences: ^2.3.2
 
dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
 
flutter:
 
  uses-material-design: true
 
  assets:
    - assets/kurals.json
    - assets/knowledge/
    - assets/logo.png
 
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#050914"
  adaptive_icon_foreground: "assets/logo.png"
 